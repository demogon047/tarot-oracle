<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Oracle - ดวงดาวนำทาง</title>
    <style>
        :root { --bg: #04020c; --gold: #c9a84c; --text: #e8deff; --purple: #6b3fa0; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        .app { max-width: 800px; margin: 0 auto; }
        h1 { color: var(--gold); margin-bottom: 5px; }
        .controls { margin: 30px 0; }
        .btn { padding: 12px 25px; margin: 5px; cursor: pointer; border-radius: 8px; border: 1px solid var(--gold); background: var(--purple); color: white; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: var(--gold); color: var(--bg); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #cards-area { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 30px; }
        .card-wrap { border: 2px solid var(--gold); border-radius: 12px; padding: 20px; width: 150px; background: #13093a; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-icon { font-size: 50px; margin: 10px 0; }
        .card-name { font-weight: bold; color: var(--gold); }
    </style>
</head>
<body>
    <div class="app">
        <h1>ออราเคิล ไพ่ยิปซี</h1>
        <p>ดวงดาวนำทาง • เลือกไพ่เพื่อทำนายดวงชะตา</p>
        
        <div class="controls">
            <button id="btn-shuffle" class="btn">🂠 สับไพ่</button>
            <button id="btn-draw" class="btn" disabled>✨ เริ่มดูดวง (3 ใบ)</button>
        </div>

        <div id="status">กด "สับไพ่" เพื่อเริ่มต้น</div>
        <div id="cards-area"></div>
    </div>

    <script>
        const CARDS = [
            { name: "The Fool", nameTH: "นักผจญภัย", icon: "🌟" },
            { name: "The Magician", nameTH: "นักมายากล", icon: "⚡" },
            { name: "The High Priestess", nameTH: "นักบวชหญิง", icon: "◐" },
            { name: "The Empress", nameTH: "จักรพรรดินี", icon: "♀" },
            { name: "The Emperor", nameTH: "จักรพรรดิ", icon: "♦" },
            { name: "The Lovers", nameTH: "คู่รัก", icon: "♡" },
            { name: "The Chariot", nameTH: "รถศึก", icon: "⊗" },
            { name: "The Sun", nameTH: "ดวงอาทิตย์", icon: "☀" },
            { name: "The World", nameTH: "โลก", icon: "○" }
        ];

        let isShuffled = false;

        document.getElementById('btn-shuffle').addEventListener('click', function() {
            this.textContent = "กำลังสับไพ่...";
            setTimeout(() => {
                isShuffled = true;
                this.textContent = "🂠 สับไพ่แล้ว";
                document.getElementById('btn-draw').disabled = false;
                document.getElementById('status').textContent = "พร้อมแล้ว! กดปุ่มดูดวงได้เลย";
            }, 1000);
        });

        document.getElementById('btn-draw').addEventListener('click', function() {
            const area = document.getElementById('cards-area');
            area.innerHTML = '';
            
            // สุ่มไพ่ 3 ใบไม่ให้ซ้ำกัน
            const shuffled = [...CARDS].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 3);

            selected.forEach(card => {
                const div = document.createElement('div');
                div.className = 'card-wrap';
                div.innerHTML = `
                    <div class="card-icon">${card.icon}</div>
                    <div class="card-name">${card.nameTH}</div>
                    <div style="font-size:12px; margin-top:5px;">${card.name}</div>
                `;
                area.appendChild(div);
            });
            document.getElementById('status').textContent = "นี่คือไพ่ของคุณในวันนี้";
        });
    </script>
</body>
</html>

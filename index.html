<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Oracle - ครบ 78 ใบ</title>
    <style>
        :root { --bg: #04020c; --gold: #c9a84c; --text: #e8deff; --purple: #6b3fa0; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; text-align: center; padding: 20px; margin: 0; line-height: 1.6; }
        .app { max-width: 900px; margin: 0 auto; }
        h1 { color: var(--gold); text-shadow: 0 0 10px rgba(201,168,76,0.3); }
        .controls { margin: 25px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 20px; cursor: pointer; border-radius: 8px; border: 1px solid var(--gold); background: var(--purple); color: white; font-weight: bold; transition: 0.3s; }
        .btn:hover:not(:disabled) { background: var(--gold); color: var(--bg); transform: translateY(-2px); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #status { font-style: italic; color: var(--gold); margin: 10px 0; height: 24px; }
        #cards-area { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 20px; min-height: 200px; }
        .card-wrap { border: 2px solid var(--gold); border-radius: 12px; padding: 15px; width: 160px; background: #13093a; animation: fadeIn 0.6s ease forwards; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card-icon { font-size: 45px; margin: 10px 0; color: #fff; }
        .card-name { font-weight: bold; color: var(--gold); font-size: 18px; }
        .card-desc { font-size: 13px; color: #ccc; margin-top: 10px; text-align: left; border-top: 1px solid rgba(201,168,76,0.2); padding-top: 10px; }
    </style>
</head>
<body>
    <div class="app">
        <h1>🔮 ออราเคิล ไพ่ยิปซี</h1>
        <p>สำรับมาตรฐานครบ 78 ใบ • พลังแห่งดวงดาวนำทางคุณ</p>
        
        <div class="controls">
            <button id="btn-shuffle" class="btn">🂠 สับไพ่</button>
            <button id="btn-draw" class="btn" disabled>✨ ดูดวง 3 ใบ (อดีต/ปัจจุบัน/อนาคต)</button>
        </div>

        <div id="status">กรุณากดปุ่ม "สับไพ่" เพื่อเริ่มต้น</div>
        <div id="cards-area"></div>
    </div>

    <script>
        // ข้อมูลไพ่ครบ 78 ใบ (Major 22 + Minor 56)
        const MAJOR = [
            {n:"The Fool", t:"นักผจญภัย", i:"🌟"}, {n:"The Magician", t:"นักมายากล", i:"⚡"}, {n:"The High Priestess", t:"นักบวชหญิง", i:"◐"},
            {n:"The Empress", t:"จักรพรรดินี", i:"♀"}, {n:"The Emperor", t:"จักรพรรดิ", i:"♦"}, {n:"The Hierophant", t:"นักบวช", i:"⊕"},
            {n:"The Lovers", t:"คู่รัก", i:"♡"}, {n:"The Chariot", t:"รถศึก", i:"⊗"}, {n:"Strength", t:"พลังใจ", i:"∞"},
            {n:"The Hermit", t:"ฤาษี", i:"◎"}, {n:"Wheel of Fortune", t:"วงล้อโชค", i:"⊚"}, {n:"Justice", t:"ยุติธรรม", i:"⚖"},
            {n:"The Hanged Man", t:"คนถูกแขวน", i:"⊜"}, {n:"Death", t:"การเปลี่ยนแปลง", i:"☽"}, {n:"Temperance", t:"ความพอดี", i:"△"},
            {n:"The Devil", t:"ปีศาจ", i:"☿"}, {n:"The Tower", t:"หอคอย", i:"💥"}, {n:"The Star", t:"ดวงดาว", i:"★"},
            {n:"The Moon", t:"ดวงจันทร์", i:"🌙"}, {n:"The Sun", t:"ดวงอาทิตย์", i:"☀"}, {n:"Judgement", t:"การตัดสิน", i:"◈"}, {n:"The World", t:"โลก", i:"○"}
        ];
        
        const SUITS = [
            {s:"Wands", i:"🪄", t:"ไม้เท้า"}, {s:"Cups", i:"🍷", t:"ถ้วย"}, 
            {s:"Swords", i:"⚔️", t:"ดาบ"}, {s:"Pentacles", i:"🪙", t:"เหรียญ"}
        ];
        
        const RANKS = ["Ace", "2", "3", "4", "5", "6", "7", "8", "9", "10", "Page", "Knight", "Queen", "King"];
        
        let ALL_CARDS = [...MAJOR];
        SUITS.forEach(suit => {
            RANKS.forEach(rank => {
                ALL_CARDS.push({ n: `${rank} of ${suit.s}`, t: `${rank} ${suit.t}`, i: suit.i });
            });
        });

        // ระบบสับไพ่แบบ Fisher-Yates
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const btnShuffle = document.getElementById('btn-shuffle');
        const btnDraw = document.getElementById('btn-draw');
        const status = document.getElementById('status');
        const area = document.getElementById('cards-area');

        btnShuffle.onclick = () => {
            btnShuffle.textContent = "กำลังสับไพ่...";
            btnShuffle.disabled = true;
            area.innerHTML = '';
            
            setTimeout(() => {
                shuffle(ALL_CARDS);
                btnShuffle.textContent = "🂠 สับไพ่แล้ว";
                btnShuffle.disabled = false;
                btnDraw.disabled = false;
                status.textContent = "ไพ่ 78 ใบพร้อมแล้ว! เลือกดูดวงได้เลย";
            }, 1000);
        };

        btnDraw.onclick = () => {
            area.innerHTML = '';
            const labels = ["อดีต", "ปัจจุบัน", "อนาคต"];
            const result = ALL_CARDS.slice(0, 3);
            
            result.forEach((card, idx) => {
                const div = document.createElement('div');
                div.className = 'card-wrap';
                div.style.animationDelay = (idx * 0.2) + 's';
                div.innerHTML = `
                    <div style="font-size:12px; color:var(--gold)">${labels[idx]}</div>
                    <div class="card-icon">${card.i}</div>
                    <div class="card-name">${card.t}</div>
                    <div style="font-size:11px; opacity:0.7">${card.n}</div>
                `;
                area.appendChild(div);
            });
            status.textContent = "นี่คือคำทำนายของคุณ";
        };
    </script>
</body>
</html>
